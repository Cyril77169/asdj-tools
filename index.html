<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASDJ - Tools</title>
<meta name="theme-color" content="#1e5c2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#eef4ea; --surface:#ffffff; --ink:#1b2a1d; --muted:#5d6e5f; --line:#d7e4d2;
  --green:#2e7d32; --green-dark:#1e5c2a; --green-deep:#143f1d; --leaf:#8cc63f; --leaf-soft:#e3f1d3;
  --s-operationnelle:#13b955; --s-controle:#00b3d6; --s-disponible:#2f7cf6; --s-probleme:#ff3b30; --s-reparation:#ff9500; --s-hs:#2c2c2e; --s-revision:#8e5bd8;
  --f-tondeuse:#e0442f; --f-debroussailleuse:#7fb52e; --f-souffleur:#d6247a; --f-taillehaie:#e8c400; --f-tronconneuse:#e8672b; --f-autoportee:#7b4fa8; --f-motoculteur:#8d6e63; --f-scarificateur:#00897b; --f-outillage:#5c6bc0; --f-vehicule:#37474f;
  --radius:18px; --shadow:0 2px 10px rgba(20,63,29,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(64px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

/* ---------- écran de chargement ---------- */
#loader{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--green-dark),var(--green-deep));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s}
#loader.fade{opacity:0;pointer-events:none}
#loader img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#loader h1{margin:0;font-size:28px;letter-spacing:.5px}
#loader p{margin:0;opacity:.85}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.3);border-top-color:var(--leaf);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- en-tête ---------- */
header.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;padding:14px 16px 16px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
header.top .row{display:flex;align-items:center;gap:12px}
header.top h1{margin:0;font-size:21px;line-height:1.15;flex:1;min-width:0}
header.top h1 small{display:block;font-size:13px;font-weight:500;opacity:.8}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;flex:none;cursor:pointer}
.iconbtn svg{width:22px;height:22px}
.logo{width:42px;height:42px;border-radius:12px;flex:none}
.hfam{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff}
.hfam svg{width:28px;height:28px}

main{padding:16px;max-width:760px;margin:0 auto}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:#fff3cd;color:#6b4e00;border:1px solid #f3d27a;font-weight:600;font-size:15px}
.banner.red{background:#ffe1df;color:#8a1c14;border-color:#f5a39d}

/* ---------- alertes accueil ---------- */
.alerts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.alert{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;color:#fff;font-weight:700;font-size:15px;box-shadow:var(--shadow)}
.alert b{font-size:18px}
.alert.calm{background:#fff!important;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-weight:600}
.alert.calm::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.photo{width:100%;aspect-ratio:4/3;border-radius:14px;background:var(--leaf-soft);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-weight:600;margin-bottom:10px;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .wait{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;padding:5px 10px;border-radius:999px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addbar{margin-top:16px}
.allgood{background:var(--leaf-soft);color:var(--green-dark);padding:12px 14px;border-radius:14px;font-weight:600;margin-bottom:14px}

/* ---------- tuiles familles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;border:2px solid transparent;cursor:pointer;min-height:178px}
.tile:active{transform:scale(.98)}
.tile .ic{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:50px;height:50px}
.tile h2{margin:2px 0 0;font-size:17px;line-height:1.15}
.tile .n{color:var(--muted);font-size:14px}
.tile.wide{grid-column:1/-1;flex-direction:row;min-height:0;text-align:left;padding:14px 16px}
.tile.wide .ic{width:56px;height:56px;background:var(--green)}
.tile.wide .ic svg{width:32px;height:32px}
.tile.wide .txt{flex:1}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;width:100%;background:var(--line)}
.bar i{display:block;height:100%}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700}
.dot::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c)}

/* ---------- filtres ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip .sw{width:12px;height:12px;border-radius:50%}
.chip.on{border-color:var(--green-dark);background:var(--green-dark);color:#fff}
.seg{display:flex;background:#fff;border-radius:12px;padding:4px;gap:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--leaf-soft);color:var(--green-dark)}
.search{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;margin-bottom:12px;font-size:16px}

/* ---------- liste machines ---------- */
.group-h{margin:18px 2px 8px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--green-dark);display:flex;align-items:center;gap:8px}
.group-h:first-child{margin-top:4px}
.group-h svg{width:20px;height:20px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:stretch;overflow:hidden;cursor:pointer}
.card:active{transform:scale(.99)}
.card .stripe{width:10px;flex:none;background:var(--c)}
.card .body{flex:1;padding:12px 12px;min-width:0}
.card .num{font-size:20px;font-weight:800;letter-spacing:.3px}
.card .mod{color:var(--muted);font-weight:600;margin-left:6px;font-size:15px}
.card .where{font-size:14px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .side{display:flex;align-items:center;padding-right:12px}
.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:var(--c);color:#fff;font-weight:800;font-size:13px;white-space:nowrap}
.card.off{opacity:.6}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
details.retired{margin-top:18px}
details.retired summary{cursor:pointer;color:var(--muted);font-weight:700;padding:8px 2px}

/* ---------- fiche machine ---------- */
.hero{border-radius:22px;color:#fff;padding:18px 18px 16px;background:var(--c);box-shadow:0 6px 20px rgba(0,0,0,.12);margin-bottom:16px;position:relative;overflow:hidden}
.hero .big{font-size:38px;font-weight:900;line-height:1}
.hero .mod{font-size:18px;font-weight:700;opacity:.95;margin-top:4px}
.hero .st{margin-top:12px;font-size:20px;font-weight:800}
.hero .since{opacity:.92;font-weight:600;margin-top:2px}
.hero .fam{position:absolute;right:14px;top:14px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.hero .fam svg{width:40px;height:40px}
.sect{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.sect h3{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:var(--green-dark)}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stbtn{border:3px solid transparent;border-radius:14px;padding:14px 8px;font-weight:800;font-size:15px;color:#fff;background:var(--c);cursor:pointer;opacity:.55;min-height:56px}
.stbtn.on{opacity:1;border-color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.where3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.where3 button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;font-weight:700;font-size:14px;cursor:pointer}
.where3 button.on{background:var(--green-dark);border-color:var(--green-dark);color:#fff}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 6px;color:var(--muted)}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fbfdfa;font-size:16px}
.inp:focus{outline:none;border-color:var(--green)}
textarea.inp{min-height:70px;resize:vertical}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.hist time{display:block;color:var(--muted);font-size:12px;font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;background:var(--green-dark);color:#fff;cursor:pointer}
.btn.light{background:var(--leaf-soft);color:var(--green-dark)}
.btn.danger{background:#ffe1df;color:#8a1c14}
.fab{position:fixed;right:18px;bottom:calc(78px + var(--safe-b));width:60px;height:60px;border-radius:50%;border:0;background:var(--green-dark);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:9}
.team{display:flex;align-items:center;gap:12px}
.team .badge{width:46px;height:46px;border-radius:14px;background:var(--green-dark);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.team .badge.depot{background:var(--s-disponible)}

/* ---------- connexion ---------- */
.login{max-width:420px;margin:0 auto;padding:30px 20px}
.login .brand{text-align:center;margin-bottom:24px}
.login .brand img{width:88px;height:88px;border-radius:22px}
.login h1{margin:10px 0 2px;color:var(--green-dark)}
.login p.sub{margin:0;color:var(--muted)}
.msg{margin-top:12px;padding:12px;border-radius:12px;background:var(--leaf-soft);color:var(--green-dark);font-weight:600}
.msg.err{background:#ffe1df;color:#8a1c14}
.link{background:none;border:0;color:var(--green);font-weight:700;margin-top:14px;cursor:pointer;width:100%;padding:10px}

/* ---------- barre d'état en bas ---------- */
#status{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe-b));display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
#status i{width:11px;height:11px;border-radius:50%;background:var(--s-operationnelle);flex:none}
#status.busy i{background:var(--s-controle);animation:pulse 1s infinite}
#status.off i{background:var(--s-probleme)}
#status.err i{background:var(--s-reparation)}
@keyframes pulse{50%{opacity:.3}}
#status .sp{flex:1}
#status button{border:0;background:none;color:var(--green);font-weight:700;cursor:pointer;padding:4px}
.muted{color:var(--muted);font-size:14px}
body.noscroll{overflow:hidden}
/* bandeau de synthèse sous la recherche (2 niveaux) */
.summary{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.sumrow{display:grid;gap:10px}
.sumrow.two{grid-template-columns:1fr 1fr}
.sumrow.three{grid-template-columns:1fr 1fr 1fr}
.sum{border-radius:16px;padding:10px 12px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:8px solid var(--c);min-width:0}
.sum b{font-size:24px;line-height:1.1;color:var(--c)}
.sum span{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum.big{background:var(--c);border-left:0;padding:12px 14px}
.sum.big b,.sum.big span{color:#fff}
.sum.big b{font-size:30px}
.sum.zero{opacity:.45}
.sum.big.zero{background:#fff;border-left:8px solid var(--c);opacity:.6}
.sum.big.zero b{color:var(--c)}.sum.big.zero span{color:var(--ink)}
.filtre{background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px;box-shadow:var(--shadow)}
.filtre a{color:var(--green);font-weight:700;margin-left:8px}
/* tuile 5 seule sur sa ligne : en largeur */
.tiles .tile:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;min-height:0;text-align:left;gap:16px}
.tiles .tile:last-child:nth-child(odd) .bar,.tiles .tile:last-child:nth-child(odd) .dots{display:none}
/* bandeau équipes (différent des machines) */
.teamband,.allband{display:block;margin-top:14px;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.teamband{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff}
.allband{background:#fff;display:flex;align-items:center;gap:12px}
.tb-top{display:flex;align-items:center;gap:12px}
.tb-ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.allband .tb-ic{background:var(--leaf-soft);color:var(--green-dark)}
.tb-ic svg{width:28px;height:28px}
.tb-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.tb-txt b{font-size:18px}.tb-txt small{opacity:.85;font-size:13px}
.allband .tb-txt small{color:var(--muted)}
.tb-chev svg{width:22px;height:22px;opacity:.8}
.tb-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tb-b{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:700}
.tb-b i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--green-dark);display:grid;place-items:center;font-size:12px}
.tb-b.warn{background:var(--s-probleme)}
/* fenêtre de confirmation */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.mback{position:absolute;inset:0;background:rgba(10,30,14,.55)}
.mbox{position:relative;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + var(--safe-b));width:100%;max-width:560px;max-height:88vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.mbox h2{margin:0 0 8px;font-size:20px;color:var(--green-dark)}
.mq{font-size:17px;margin:4px 0 6px;line-height:1.4}
.mnote{background:var(--leaf-soft);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.mbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:16px}
.mlist{margin:0;padding-left:20px;font-size:15px;line-height:1.6}
.pick{margin-top:2px}
/* rôles, journal, annulations (v7) */
.who{display:inline-block;font-weight:800;padding:1px 8px;border-radius:999px;font-size:12px;margin-right:4px;background:#fff1d6;color:#8a5a00}
.who.c{background:#e5f6e8;color:#1b6b2e}.who.n{background:#e3f0ff;color:#1a4f9c}
.hrow{display:flex;gap:6px;align-items:center;position:relative}.hrow .tx{flex:1;min-width:0}
.dots{border:0;background:transparent;color:#8a8f8a;font-size:22px;font-weight:900;line-height:1;padding:4px 8px;border-radius:10px;letter-spacing:1px;cursor:pointer;flex:none}
.dots.on{background:#eef2ee;color:#333}
.pop{position:absolute;right:4px;top:calc(100% - 6px);z-index:20;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:6px;min-width:220px}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;font-size:15px;font-weight:700;border-radius:10px;color:#a3261b;cursor:pointer}
.pop button.n{color:#333}
.undone{text-decoration:line-through;color:#999}.undone .who{opacity:.6}
.tag{font-size:12px;color:#777;display:block;text-decoration:none}
.evlist li{position:relative}.evlist li.undone{opacity:.6}.evlist li.undone .evtxt>b,.evlist li.undone .evtxt>div,.evlist li.undone .evm{text-decoration:line-through}
.thin{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px auto 0;padding:8px 10px;color:var(--muted);font-size:13px;font-weight:600}
.thin u{text-decoration:none;border-bottom:1px dotted #9aa}
.smallbtn{border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:700;border-radius:999px;padding:8px 12px;font-size:13px;flex:none;cursor:pointer}
.sh{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:6px}.sh h3{margin:0}
.acc{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);position:relative}
.acc:last-child{border-bottom:0}.acc .nm{flex:1}.acc .nm b{font-size:16px}
.role{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.role.chef{background:#e5f6e8;color:#1b6b2e}.role.eq{background:#fff1d6;color:#8a5a00}.role.as{background:#ede4ff;color:#5b3aa8}.role.off{background:#ffe1df;color:#8a1c14}
.lock{display:flex;gap:8px;align-items:center;background:#f2f2f4;color:#555;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin:6px 0}
.btn.dis{background:#e9e9ec!important;color:#9a9aa0!important;cursor:default}
.inp:disabled{background:#f2f2f4;color:#9a9aa0}
.box2{background:#f4f6f4;border-radius:12px;padding:10px 12px;margin:8px 0}
.warnbox{background:#fff6e0;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
#modal.center{align-items:center;padding:20px}#modal.center .mbox{border-radius:22px;padding-bottom:18px}
.more{margin-top:10px}
.mbtns.one{grid-template-columns:1fr}
/* véhicules (v9) */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e4ece4;border-radius:14px;padding:4px;margin:0 0 12px}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:11px;font-size:15px;font-weight:800;color:#4a5a4a;border:0;background:transparent;cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:#1b5e20;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg .due{margin:0}
.alertband{display:flex;gap:10px;align-items:center;background:#fff3e0;border:2px solid #ffb74d;border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14px;color:#6d4300;text-decoration:none}
.alertband b{font-size:15px;color:#e65100}.alertband .ab-nv{font-size:13px;font-weight:700;color:#a04f00}.alertband .ab-ic{font-size:26px}
.plate{display:inline-flex;align-items:stretch;border:2px solid #222;border-radius:6px;background:#fff;font-weight:800;font-size:17px;letter-spacing:1px;color:#111;overflow:hidden;line-height:1;vertical-align:middle}
.plate i{background:#0040a0;color:#fff;font-style:normal;font-size:10px;display:flex;align-items:flex-end;padding:3px 3px 2px;letter-spacing:0}
.plate span{padding:5px 8px}
.plate.big{font-size:24px}.plate.big span{padding:7px 12px}
.plate.vide span{color:#888;font-size:13px;font-weight:700;letter-spacing:0}
.vlist{margin-top:12px}
.vcard{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px;border-left:6px solid var(--c);color:inherit;text-decoration:none}
.vcard.off{opacity:.55}
.vcard .vi{width:46px;height:46px;border-radius:12px;background:var(--c);padding:8px;color:#fff;flex:none}.vcard .vi svg{width:100%;height:100%}
.vcard .vt{flex:1;min-width:0}.vcard .vt small{display:block;color:#666;font-size:13px;margin-top:4px}
