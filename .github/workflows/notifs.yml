name: Notifications
# Chaque matin vers 6 h et à midi (heure de Paris). Le robot est lancé deux fois par créneau
# (heure d'été / heure d'hiver) ; il vérifie lui-même l'heure de Paris et n'envoie qu'une fois.
on:
  schedule:
    - cron: "45 3 * * *"
    - cron: "45 4 * * *"
    - cron: "45 9 * * *"
    - cron: "45 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["robot/test-notif.txt"]
permissions:
  contents: read
jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3
      - name: Envoyer les notifications
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SUPABASE_REF: qrqccrlxuugwehugbgjb
          NOTIF_TEST: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node robot/notifs.mjs
