<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASDJ - Tools · clé des notifications</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:20px;background:#f1f6ef;color:#1d2a1d}
h1{font-size:22px;color:#1b5e20}.box{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin:14px 0}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#2e7d32;color:#fff;font-size:16px;font-weight:700}
button.l{background:#e3efe0;color:#1b5e20;margin-top:10px}code{display:block;word-break:break-all;background:#f4f6f4;border-radius:10px;padding:12px;font-size:15px;margin-top:10px}
.w{background:#fff3e0;border-radius:12px;padding:10px 12px;font-size:14px}</style></head>
<body><h1>🔑 Clé des notifications</h1>
<div class="box"><p>Cette page fabrique la clé secrète des notifications <b>sur ce téléphone</b>. Elle n'est envoyée nulle part.</p>
<p class="w">⚠️ Ne l'envoie à personne (ni par message, ni dans une conversation). Colle-la seulement dans GitHub, dans les Secrets du dépôt, sous le nom <b>VAPID_PRIVATE</b>.</p>
<button id="go">Fabriquer la clé</button><div id="out"></div></div>
<script>
const b64u = a => btoa(String.fromCharCode(...a)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
document.getElementById("go").onclick = async () => {
  const kp = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  const jwk = await crypto.subtle.exportKey("jwk", kp.privateKey);
  const k = jwk.d;
  document.getElementById("out").innerHTML = `<code id="k">${k}</code><button class="l" id="cp">📋 Copier la clé</button><p id="ok"></p>`;
  document.getElementById("cp").onclick = async () => { try { await navigator.clipboard.writeText(k); document.getElementById("ok").textContent = "✅ Copiée. Va la coller dans GitHub."; } catch (e) { document.getElementById("ok").textContent = "Copie impossible : sélectionne le texte au-dessus à la main (appui long) puis Copier."; } };
};
</script></body></html>
